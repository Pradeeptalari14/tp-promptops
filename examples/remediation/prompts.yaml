# Option: Incident Remediation + Phi-3 + JSON Schema
prompts:
  - id: "sre-incident-resolver"
    version: "1.2.0"
    model_routing:
      primary: "microsoft/Phi-3-mini-4k-instruct"
      fallback: "meta-llama/Meta-Llama-3-8B-Instruct"
    system_template: |
      You are an expert SRE advisor. Analyze the following incident payload:
      {{ incident_payload }}
      Provide a structured remediation workflow focusing on resolving root causes.
    parameters:
      temperature: 0.1
      max_tokens: 1024
    schema:
      type: "object"
      properties:
        root_cause: { type: "string" }
        remediation_steps: { type: "array", items: { type: "string" } }
        risk_level: { type: "string", enum: ["low", "medium", "high"] }
      required: ["root_cause", "remediation_steps", "risk_level"]